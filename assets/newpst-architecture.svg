<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <rect width="1000" height="500" fill="#F8FAFC" rx="12"/>
  <rect width="998" height="498" x="1" y="1" fill="none" stroke="#E2E8F0" stroke-width="2" rx="12"/>

  <!-- Title -->
  <text x="40" y="45" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#0F172A">NEWPST — TRANSMISSION GRID ASSET ARCHITECTURE &amp; GEOSPATIAL INTEGRATION</text>
  <text x="40" y="68" font-family="'Inter', sans-serif" font-size="12" fill="#64748B">Event-Driven Message Broker &amp; Multi-Region Data Pipeline</text>

  <!-- Node 1: Regional Field Sensors & SCADA -->
  <g transform="translate(60, 140)">
    <rect width="220" height="240" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" rx="8"/>
    <rect x="0" y="0" width="220" height="36" fill="#EFF6FF" rx="8"/>
    <text x="110" y="24" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#1D4ED8">📡 Transmission Sensors</text>
    <text x="20" y="70" font-family="'Inter', sans-serif" font-size="11" fill="#334155">• Tower Vibration Monitoring</text>
    <text x="20" y="100" font-family="'Inter', sans-serif" font-size="11" fill="#334155">• Sag &amp; Tension Sensors</text>
    <text x="20" y="130" font-family="'Inter', sans-serif" font-size="11" fill="#334155">• Thermal Drone Inspections</text>
    <text x="20" y="160" font-family="'Inter', sans-serif" font-size="11" fill="#334155">• GIS Coordinates Tracking</text>
    <rect x="20" y="185" width="180" height="32" fill="#F1F5F9" rx="4"/>
    <text x="110" y="206" text-anchor="middle" font-family="'Fira Code', monospace" font-size="10" fill="#475569">Protocol: MQTT / IoT</text>
  </g>

  <!-- Node 2: Central Message Broker -->
  <g transform="translate(390, 140)">
    <rect width="220" height="240" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5" rx="8"/>
    <rect x="0" y="0" width="220" height="36" fill="#F1F5F9" rx="8"/>
    <text x="110" y="24" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#0F172A">⚡ Event Stream Bus</text>
    <text x="20" y="70" font-family="'Inter', sans-serif" font-size="11" fill="#334155">• Topic: transmission.events</text>
    <text x="20" y="100" font-family="'Inter', sans-serif" font-size="11" fill="#334155">• Real-time Decoupling</text>
    <text x="20" y="130" font-family="'Inter', sans-serif" font-size="11" fill="#334155">• Failover Replay Log</text>
    <text x="20" y="160" font-family="'Inter', sans-serif" font-size="11" fill="#334155">• Schema Registry Sync</text>
    <rect x="20" y="185" width="180" height="32" fill="#EFF6FF" rx="4"/>
    <text x="110" y="206" text-anchor="middle" font-family="'Fira Code', monospace" font-size="10" fill="#1D4ED8">Apache Kafka / RabbitMQ</text>
  </g>

  <!-- Node 3: NewPST Core & GIS Mapping -->
  <g transform="translate(720, 140)">
    <rect width="220" height="240" fill="#FFFFFF" stroke="#059669" stroke-width="1.5" rx="8"/>
    <rect x="0" y="0" width="220" height="36" fill="#ECFDF5" rx="8"/>
    <text x="110" y="24" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#047857">🌐 NewPST Core Engine</text>
    <text x="20" y="70" font-family="'Inter', sans-serif" font-size="11" fill="#334155">• Geospatial Map Render</text>
    <text x="20" y="100" font-family="'Inter', sans-serif" font-size="11" fill="#334155">• Multi-Tier Approval Flow</text>
    <text x="20" y="130" font-family="'Inter', sans-serif" font-size="11" fill="#334155">• Lifecycle Tracking</text>
    <text x="20" y="160" font-family="'Inter', sans-serif" font-size="11" fill="#334155">• BRD/BRS Traceability</text>
    <rect x="20" y="185" width="180" height="32" fill="#ECFDF5" rx="4"/>
    <text x="110" y="206" text-anchor="middle" font-family="'Fira Code', monospace" font-size="10" fill="#059669">RESTful API &amp; WebGL</text>
  </g>

  <!-- Connections -->
  <path d="M 280 260 L 390 260" stroke="#2563EB" stroke-width="2"/>
  <polygon points="385,255 395,260 385,265" fill="#2563EB"/>

  <path d="M 610 260 L 720 260" stroke="#059669" stroke-width="2"/>
  <polygon points="715,255 725,260 715,265" fill="#059669"/>

  <!-- Footer -->
  <g transform="translate(60, 420)">
    <rect width="880" height="50" fill="#FFFFFF" stroke="#E2E8F0" rx="6"/>
    <text x="440" y="30" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#475569">✓ 100% Asset Lifecycle Traceability  |  ✓ Sub-Second Event Ingestion  |  ✓ Multi-Region Redundancy</text>
  </g>
</svg>
