    <text x="320" y="52" font-family="'Inter', sans-serif" font-size="11" fill="#059669">Avg: 340ms | P95: 510ms | 0% Error</text>

    <text x="20" y="72" font-family="'Fira Code', monospace" font-size="11" fill="#1E40AF">POST /api/v1/inspeksi/cbm-batch-upload</text>
