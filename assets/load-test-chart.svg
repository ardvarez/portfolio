    <circle cx="430" cy="140" r="5" fill="#1D4ED8"/>
    <circle cx="430" cy="140" r="9" stroke="#2563EB" stroke-width="1.5" fill="none"/>
    <rect x="380" y="90" width="100" height="35" fill="#FFFFFF" stroke="#CBD5E1" rx="4"/>
    <text x="430" y="106" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="bold" fill="#1D4ED8">Peak 672ms</text>
    <text x="430" y="118" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" fill="#64748B">105 Concurrent VUs</text>
