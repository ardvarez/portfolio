    <text x="430" y="335" font-family="'Fira Code', monospace" font-size="10" fill="#64748B">10:00 (Peak 105 VU)</text>
    <text x="650" y="335" font-family="'Fira Code', monospace" font-size="10" fill="#64748B">15:00 (Sustained)</text>
