<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <rect width="1000" height="620" fill="#F8FAFC" rx="12"/>
  <rect width="998" height="618" x="1" y="1" fill="none" stroke="#E2E8F0" stroke-width="2" rx="12"/>

  <!-- Header -->
  <text x="40" y="45" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#0F172A">POWERSWIFT ERS — EMERGENCY MOBILIZATION SEQUENCE DIAGRAM</text>
  <text x="40" y="68" font-family="'Inter', sans-serif" font-size="12" fill="#64748B">Multi-Tier Approval, Stock Opname Reservation &amp; Dispatch Workflow</text>

  <!-- Actors / Lifelines -->
  <!-- 1. Field Dispatcher -->
  <g transform="translate(80, 100)">
    <rect width="130" height="40" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" rx="6"/>
    <text x="65" y="25" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#1E40AF">Field Operator</text>
    <line x1="65" y1="40" x2="65" y2="470" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6,4"/>
  </g>

  <!-- 2. PowerSwift Gateway -->
  <g transform="translate(300, 100)">
    <rect width="140" height="40" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.5" rx="6"/>
    <text x="70" y="25" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#0F172A">PowerSwift Core</text>
    <line x1="70" y1="40" x2="70" y2="470" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6,4"/>
  </g>

  <!-- 3. Stock Opname System -->
  <g transform="translate(530, 100)">
    <rect width="150" height="40" fill="#FFFFFF" stroke="#059669" stroke-width="1.5" rx="6"/>
    <text x="75" y="25" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#047857">Inventory / Stock API</text>
    <line x1="75" y1="40" x2="75" y2="470" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6,4"/>
  </g>

  <!-- 4. Executive Manager -->
  <g transform="translate(770, 100)">
    <rect width="140" height="40" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5" rx="6"/>
    <text x="70" y="25" text-anchor="middle" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#B45309">Manager Approval</text>
    <line x1="70" y1="40" x2="70" y2="470" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="6,4"/>
  </g>

  <!-- Lifeline Active Bars -->
  <rect x="140" y="160" width="10" height="290" fill="#DBEAFE" rx="2"/>
  <rect x="365" y="160" width="10" height="290" fill="#E2E8F0" rx="2"/>
  <rect x="600" y="210" width="10" height="110" fill="#D1FAE5" rx="2"/>
  <rect x="835" y="330" width="10" height="90" fill="#FEF3C7" rx="2"/>

  <!-- Sequence Messages -->
  <!-- 1. Submit Emergency Ticket -->
  <path d="M 145 180 L 365 180" stroke="#2563EB" stroke-width="2"/>
  <polygon points="360,175 370,180 360,185" fill="#2563EB"/>
  <text x="255" y="173" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" fill="#1E293B">1. postEmergencyIncident(location, tower_id)</text>

  <!-- 2. Lock & Reserve Tower Inventory -->
  <path d="M 370 230 L 600 230" stroke="#0F172A" stroke-width="2"/>
  <polygon points="595,225 605,230 595,235" fill="#0F172A"/>
  <text x="485" y="223" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" fill="#1E293B">2. reserveStock(tower_parts_list)</text>

  <!-- 3. Return Stock Allocation Result -->
  <path d="M 600 280 L 370 280" stroke="#059669" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="375,275 365,280 375,285" fill="#059669"/>
  <text x="485" y="273" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" fill="#047857">3. stockReserved(batch_id, status: OK)</text>

  <!-- 4. Trigger High Priority Manager Push Notification -->
  <path d="M 370 340 L 835 340" stroke="#D97706" stroke-width="2"/>
  <polygon points="830,335 840,340 830,345" fill="#D97706"/>
  <text x="600" y="333" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" fill="#1E293B">4. requestExecutiveDispatchApproval(batch_id)</text>

  <!-- 5. Manager Approve -->
  <path d="M 835 390 L 370 390" stroke="#D97706" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="375,385 365,390 375,395" fill="#D97706"/>
  <text x="600" y="383" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" fill="#B45309">5. approveDispatch(digital_signature)</text>

  <!-- 6. Issue Field Work Order -->
  <path d="M 365 440 L 145 440" stroke="#2563EB" stroke-width="2" stroke-dasharray="4,4"/>
  <polygon points="150,435 140,440 150,445" fill="#2563EB"/>
  <text x="255" y="433" text-anchor="middle" font-family="'Fira Code', monospace" font-size="11" fill="#1D4ED8">6. dispatchWorkOrder(qr_manifest_code)</text>

  <!-- Legend Footer -->
  <g transform="translate(40, 530)">
    <rect width="920" height="60" fill="#FFFFFF" stroke="#E2E8F0" rx="6"/>
    <text x="20" y="25" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#475569">KEY ARCHITECTURE HIGHLIGHTS:</text>
    <text x="20" y="45" font-family="'Inter', sans-serif" font-size="11" fill="#334155">• End-to-end latency &lt; 450ms  |  • Real-time WebSocket Status Push  |  • QR Code Materials Scanning for Field Drivers</text>
  </g>
</svg>
